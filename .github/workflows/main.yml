# Build Xiaomi Kernel (dandelion / MT6765) — dengan KernelSU bawaan
#
# Taruh file ini di: .github/workflows/build-kernel.yml (di root repo GitHub kamu)
#
# Catatan penting soal source ini:
# - KernelSU sudah TERINTEGRASI di source (folder /KernelSU + symlink drivers/kernelsu),
#   dan CONFIG_KSU=y sudah aktif di semua defconfig. Jadi workflow ini TIDAK perlu
#   curl|bash setup script apapun — tinggal build seperti biasa.
# - clean.sh / syscall_hook.sh yang mungkin kamu lihat di referensi lain TIDAK ada
#   di source ini, jadi step itu dihapus (kalau memang punya script itu, tinggal
#   tambahkan lagi stepnya).
# - Runner dipakai ubuntu-20.04 (bukan 22.04): tools/dct/DrvGen.py (generator
#   device-tree MediaTek) adalah skrip Python 2 lama, dan Ubuntu 22.04 sudah
#   tidak menyediakan paket python2 sama sekali. 20.04 masih punya.

name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig yang mau dibuild"
        required: true
        default: "dandelion_defconfig"
        type: choice
        options:
          - dandelion_defconfig
          - angelica_defconfig
          - angelican_defconfig
          - angelicain_defconfig
          - angelicain_debug_defconfig
          - cattail_defconfig
      root_solution:
        description: "Root solution"
        required: true
        default: "kernelsu"
        type: choice
        options:
          - kernelsu
          - resukisu
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

env:
  TZ: "Asia/Jakarta"
  ARCH: "arm64"
  KBUILD_BUILD_USER: "github-actions"
  KBUILD_BUILD_HOST: "ci"

jobs:
  build:
    name: Build ${{ github.event.inputs.defconfig || 'dandelion_defconfig' }} (${{ github.event.inputs.root_solution || 'kernelsu' }})
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve defconfig
        run: |
          echo "KERNEL_DEFCONFIG=${{ github.event.inputs.defconfig || 'dandelion_defconfig' }}" >> "$GITHUB_ENV"
          echo "ROOT_SOLUTION=${{ github.event.inputs.root_solution || 'kernelsu' }}" >> "$GITHUB_ENV"

      - name: Integrate ReSukiSU
        if: env.ROOT_SOLUTION == 'resukisu'
        run: |
          # Source ini sudah punya KernelSU manual-hook (drivers/kernelsu -> ../KernelSU/kernel,
          # CONFIG_KSU=y + patch hook manual di fs/exec.c dkk). ReSukiSU adalah fork dari KernelSU
          # yang menjaga titik hook tetap kompatibel, jadi cukup ganti isi folder KernelSU lalu
          # jalankan setup.sh resminya di root repo.
          rm -rf KernelSU drivers/kernelsu kernelsu
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          # Pastikan symlink driver ketemu (nama folder driver di source ini: drivers/kernelsu)
          if [ ! -e drivers/kernelsu ]; then
            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi
          echo "ROOT_SOLUTION_LABEL=ReSukiSU" >> "$GITHUB_ENV"

      - name: Set root solution label
        if: env.ROOT_SOLUTION == 'kernelsu'
        run: echo "ROOT_SOLUTION_LABEL=KernelSU" >> "$GITHUB_ENV"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev \
            cpio kmod git zip unzip curl ca-certificates \
            device-tree-compiler python3

      - name: Install Python 2 (required by MediaTek DCT/DrvGen tools)
        run: |
          # tools/dct/DrvGen.py (generates the MTK device-tree cust.dtsi) is a
          # legacy Python 2 script and shebangs #!/usr/bin/python. We install
          # python2 from universe and put a `python` shim first on PATH.
          sudo apt-get install -y --no-install-recommends python2
          mkdir -p /tmp/py2shim
          ln -sf "$(command -v python2)" /tmp/py2shim/python
          echo "/tmp/py2shim" >> "$GITHUB_PATH"

      - name: Verify python shim
        run: |
          python --version
          python -c "print 'python2 ok'"

      - name: Cache toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /tmp/toolchain
          key: toolchain-clang-r428724-gcc49-v1

      - name: Download toolchains
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/toolchain
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git \
            /tmp/toolchain/clang
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            /tmp/toolchain/gcc-aarch64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            /tmp/toolchain/gcc-arm

      - name: Export toolchain path
        run: |
          echo "/tmp/toolchain/clang/bin" >> "$GITHUB_PATH"
          echo "/tmp/toolchain/gcc-aarch64/bin" >> "$GITHUB_PATH"
          echo "/tmp/toolchain/gcc-arm/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          clang --version
          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

      - name: Build kernel
        run: |
          START_TIME=$(date +%s)

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}

          make -j"$(nproc --all)" \
            O=out \
            ARCH=${ARCH} \
            CC=${CC} \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            2>&1 | tee build.log

          echo "BUILD_SECONDS=$(( $(date +%s) - START_TIME ))" >> "$GITHUB_ENV"

      - name: Locate kernel image
        run: |
          BOOT_DIR="out/arch/${ARCH}/boot"
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            echo "KERNEL_IMAGE=$BOOT_DIR/Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            echo "KERNEL_IMAGE=$BOOT_DIR/Image.gz" >> "$GITHUB_ENV"
          elif [ -f "$BOOT_DIR/Image" ]; then
            echo "KERNEL_IMAGE=$BOOT_DIR/Image" >> "$GITHUB_ENV"
          else
            echo "::error::No kernel image produced — check build.log"
            ls -la "$BOOT_DIR" || true
            exit 1
          fi

      - name: Set artifact name
        run: |
          VARIANT=$(echo "${KERNEL_DEFCONFIG}" | sed 's/_defconfig$//')
          echo "ARTIFACT_NAME=Nadeko-${VARIANT}-${ROOT_SOLUTION_LABEL}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Package with AnyKernel3
        run: |
          git clone -b master --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          rm -rf zImage Image* dtb* *.dtb ramdisk patch tools/*.sh.orig 2>/dev/null || true

          cp "../${KERNEL_IMAGE}" .

          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Nadeko Kernel for MIUI Q
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=dandelion
          device.name2=angelica
          device.name3=angelican
          device.name4=angelicain
          device.name5=cattail
          supported.versions=
          supported.patchlevels=
          '; }

          block=auto;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          zip -r9 "../${ARTIFACT_NAME}.zip" . -x ".git*" "README.md"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          retention-days: 30

      - name: Upload raw kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-raw
          path: ${{ env.KERNEL_IMAGE }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.ARTIFACT_NAME }}
          path: build.log
          retention-days: 7

      - name: Telegram notification
        if: always() && env.BOT_TOKEN != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MIN=$((BUILD_SECONDS / 60)); SEC=$((BUILD_SECONDS % 60))
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@"${ARTIFACT_NAME}.zip" \
              -F caption="${ARTIFACT_NAME} build succeeded in ${MIN}m ${SEC}s" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          else
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@build.log \
              -F caption="${KERNEL_DEFCONFIG} build failed — check log" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          fi
